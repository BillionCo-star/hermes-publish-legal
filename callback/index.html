<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>OAuth Callback — Hermes Publish</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:Inter,sans-serif}</style>
</head>
<body class="bg-zinc-50 text-zinc-900">
<div class="max-w-xl mx-auto px-6 py-14">
  <div class="bg-white border rounded-xl p-6">
    <h1 class="font-bold text-lg">TikTok OAuth Callback</h1>
    <p class="text-sm text-zinc-600 mt-2">If TikTok redirected you here, copy the values below and paste back to Hermes.</p>
    <div id="out" class="mt-4 space-y-3 text-sm font-mono break-all"></div>
    <p class="text-xs text-zinc-500 mt-6">App awqz1z09s92hrtgo · State must match <code>vespera</code>. Close this window after copying.</p>
  </div>
  <p class="text-xs text-zinc-500 text-center mt-4"><a href="index.html" class="underline">← Home</a></p>
</div>
<script>
const p = new URLSearchParams(location.search);
const code = p.get('code'), state = p.get('state'), error = p.get('error'), desc = p.get('error_description');
let h = '';
if (code) h += `<div class="border rounded p-3 bg-green-50"><b>code</b><br/>${code}</div>`;
if (state) h += `<div class="border rounded p-3"><b>state</b><br/>${state}</div>`;
if (error) h += `<div class="border rounded p-3 bg-red-50"><b>error</b><br/>${error}<br/><span class="text-xs">${desc||''}</span></div>`;
if (!code && !error) h = `<div class="border rounded p-3 bg-amber-50">No code or error in URL. Query: ${location.search || '(empty)'}<br/><span class="text-xs">Make sure Redirect URI in TikTok Developer portal is exactly: ${location.origin+location.pathname}</span></div>`;
document.getElementById('out').innerHTML = h;
</script>
</body>
</html>
